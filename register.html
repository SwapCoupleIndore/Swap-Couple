{% extends 'base.html' %}{% block content %}<section class="card"><h1>18+ Registration</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" maxlength="80" required></label><label>Date of birth<input type="date" name="birthdate" required></label><label>City<input name="city" required></label><label>Email<input type="email" name="email" required></label><label>Mobile with country code<input name="phone" placeholder="+919876543210" required></label><label>Password (12+ characters)<input type="password" name="password" minlength="12" required></label><button class="btn">Register</button></form><p class="small">Registration से आप 18+ होने और हमारी <a href="{{url_for('privacy')}}">Privacy Notice</a> पढ़ने की पुष्टि करते हैं।</p></section>{% endblock %}
