{% extends 'base.html' %}{% block content %}<section class="card"><div class="badge">Verified members only</div><h1>♥ Swap Couple</h1><p>Romantic, private, and respectful connections.</p><div class="panel"><h2>Owner Photos</h2>{% for photo in photos %}<img src="{{url_for('view_media',mid=photo.id)}}" alt="Owner profile photo" style="max-width:100%;height:auto;border-radius:12px">{% else %}<p class="small">Photos are not available yet.</p>{% endfor %}</div><div class="panel"><h2>Message Request</h2><form method="post" action="{{url_for('request_message')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><textarea name="note" maxlength="500" placeholder="अपना परिचय लिखें"></textarea><button class="btn">Send Request</button></form></div><a class="btn secondary" href="{{url_for('chat')}}">Private Chat (if approved)</a></section>{% endblock %}
