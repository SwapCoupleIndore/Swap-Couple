<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swap Couple</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header><a class="brand" href="{{url_for('home')}}">♥ Swap Couple</a><nav>{% if current_user.is_authenticated %}<a href="{{url_for('dashboard' if current_user.is_admin else 'status')}}">Dashboard</a><form method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Logout</button></form>{% else %}<a href="{{url_for('register')}}">Register</a><a href="{{url_for('login')}}">Login</a>{% endif %}</nav></header><main>{% with msgs=get_flashed_messages() %}{% for msg in msgs %}<div class="alert">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>18+ • Consent & Privacy First • <a href="{{url_for('privacy')}}">Privacy</a> • © {{year}}</footer></body></html>
